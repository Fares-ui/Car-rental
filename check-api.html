<!DOCTYPE html>
<html>
<head>
    <title>API Check</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>API Connection Test</h1>
    <div id="result"></div>
    
    <script>
        // Test different API paths
        const paths = [
            'api/cars.php?format=json',
            '/web/api/cars.php?format=json',
            '../api/cars.php?format=json'
        ];
        
        paths.forEach(path => {
            $.ajax({
                url: path,
                method: 'GET',
                success: function(response) {
                    $('#result').append(`<p style="color:green;">✅ SUCCESS: ${path}</p>`);
                    console.log('Working path:', path, response);
                },
                error: function(xhr, status, error) {
                    $('#result').append(`<p style="color:red;">❌ FAILED: ${path} - ${error}</p>`);
                }
            });
        });
    </script>
</body>
</html>
