<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Backend Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .register-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
    }
    
    .register-container h1 {
      text-align: center;
      color: #333;
      margin-bottom: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      border-color: #FF5000;
      box-shadow: 0 0 10px rgba(255, 80, 0, 0.2);
    }
    
    .register-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #FF5000 0%, #cc4000 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }
    
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 80, 0, 0.4);
    }
    
    .register-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .login-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #666;
    }
    
    .login-link a {
      color: #FF5000;
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #666;
      text-decoration: none;
    }
    
    .back-link:hover {
      color: #FF5000;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid #28a745;
      display: none;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid #dc3545;
      display: none;
    }

    .error-message.show,
    .success-message.show {
      display: block;
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: 0.3rem;
      padding: 0.3rem;
      border-radius: 4px;
    }

    .strength-weak { background: #f8d7da; color: #721c24; }
    .strength-medium { background: #fff3cd; color: #856404; }
    .strength-strong { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>📝 Create Account</h1>
    
    <div class="success-message" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>
    
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="fullName" required placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="phone" required placeholder="+1 234 567 8900">
      </div>
      
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="password" required placeholder="Minimum 8 characters">
        <div id="passwordStrength" class="password-strength" style="display: none;"></div>
      </div>

      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" id="confirmPassword" required placeholder="Re-enter password">
      </div>
      
      <button type="submit" class="register-btn" id="registerBtn">Create Account</button>
    </form>
    
    <p class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
  
  <script>
    // Password strength checker
    document.getElementById('password').addEventListener('input', function() {
      const password = this.value;
      const strengthDiv = document.getElementById('passwordStrength');
      
      if (password.length === 0) {
        strengthDiv.style.display = 'none';
        return;
      }
      
      strengthDiv.style.display = 'block';
      
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;
      
      if (strength <= 1) {
        strengthDiv.className = 'password-strength strength-weak';
        strengthDiv.textContent = '⚠️ Weak password';
      } else if (strength <= 3) {
        strengthDiv.className = 'password-strength strength-medium';
        strengthDiv.textContent = '✓ Medium password';
      } else {
        strengthDiv.className = 'password-strength strength-strong';
        strengthDiv.textContent = '✓✓ Strong password';
      }
    });

    // Form submission
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const registerBtn = document.getElementById('registerBtn');
      
      // Clear previous messages
      hideMessages();
      
      // Validation
      if (!fullName || !email || !phone || !password || !confirmPassword) {
        showError('Please fill in all fields');
        return;
      }
      
      // Email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }
      
      // Password length check
      if (password.length < 8) {
        showError('Password must be at least 8 characters long');
        return;
      }
      
      // Password match check
      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }
      
      // Disable button during processing
      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating Account...';
      
      // Simulate registration (in production, send to backend)
      setTimeout(() => {
        // Save user data to localStorage (demo mode)
        const userData = {
          fullName: fullName,
          email: email,
          phone: phone,
          registeredAt: new Date().toISOString()
        };
        
        // Check if user already exists
        const existingUsers = JSON.parse(localStorage.getItem('backend_project_users') || '[]');
        const userExists = existingUsers.some(u => u.email === email);
        
        if (userExists) {
          showError('An account with this email already exists');
          registerBtn.disabled = false;
          registerBtn.textContent = 'Create Account';
          return;
        }
        
        // Add new user
        existingUsers.push(userData);
        localStorage.setItem('backend_project_users', JSON.stringify(existingUsers));
        
        // Show success
        showSuccess('Account created successfully! Redirecting to login...');
        
        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      }, 1000);
    });

    function showError(message) {
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
    }

    function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = message;
      successMsg.classList.add('show');
    }

    function hideMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }
  </script>
</body>
</html>
