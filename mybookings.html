<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - DriveNow</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    .bookings-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
    }
    
    .bookings-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    
    .bookings-header h1 {
      color: #fff;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    
    .bookings-header p {
      color: #aaa;
      font-size: 1.1rem;
    }
    
    .booking-card {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }
    
    .booking-card:hover {
      transform: translateY(-5px);
    }
    
    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }
    
    .booking-id {
      font-size: 1.2rem;
      font-weight: bold;
      color: #FF5000;
    }
    
    .booking-status {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .status-confirmed {
      background: #28a745;
      color: #fff;
    }
    
    .status-pending {
      background: #ffc107;
      color: #000;
    }
    
    .status-cancelled {
      background: #dc3545;
      color: #fff;
    }
    
    .booking-body {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 2rem;
      align-items: start;
    }
    
    .car-image {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    .booking-details {
      color: #fff;
    }
    
    .booking-details h3 {
      color: #FF5000;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .detail-label {
      color: #aaa;
      font-weight: 600;
    }
    
    .detail-value {
      color: #fff;
      font-weight: 500;
    }
    
    .total-amount {
      font-size: 1.5rem;
      font-weight: bold;
      color: #28a745;
    }
    
    .no-bookings {
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 15px;
    }
    
    .no-bookings h2 {
      color: #fff;
      margin-bottom: 1rem;
    }
    
    .no-bookings p {
      color: #aaa;
      margin-bottom: 2rem;
    }
    
    .browse-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #FF5000;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .browse-btn:hover {
      background: #cc4000;
      transform: translateY(-2px);
    }
    
    .login-prompt {
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 15px;
    }
    
    .login-prompt h2 {
      color: #fff;
      margin-bottom: 1rem;
    }
    
    .login-prompt p {
      color: #aaa;
      margin-bottom: 2rem;
    }
    
    .login-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #FF5000;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
      margin: 0 0.5rem;
    }
    
    .login-btn:hover {
      background: #cc4000;
      transform: translateY(-2px);
    }
    
    @media (max-width: 768px) {
      .booking-body {
        grid-template-columns: 1fr;
      }
      
      .bookings-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">DriveNow</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#vehicles">Vehicles</a></li>
        <li><a href="my-bookings.html">My Bookings</a></li>
        <li><a href="login.html" id="authLink">Login</a></li>
      </ul>
    </nav>
  </header>

  <div class="bookings-container">
    <div class="bookings-header">
      <h1>🚗 My Bookings</h1>
      <p>View and manage your car rental bookings</p>
    </div>

    <div id="bookingsContent">
      <!-- Bookings will be loaded here -->
    </div>
  </div>

  <script>
    $(document).ready(function() {
      const API_BASE = 'api/'; // Correct path
      
      // Check authentication
      checkAuth();
      
      function checkAuth() {
        const userEmail = sessionStorage.getItem('userEmail');
        const isAuthenticated = sessionStorage.getItem('userAuthenticated') === 'true';
        
        if (isAuthenticated && userEmail) {
          $('#authLink').text('Logout').attr('href', '#').on('click', logout);
          loadBookings(userEmail);
        } else {
          showLoginPrompt();
        }
      }
      
      function loadBookings(email) {
        $.ajax({
          url: `${API_BASE}bookings.php?email=${encodeURIComponent(email)}&format=json`,
          method: 'GET',
          success: function(response) {
            const bookings = response.data?.bookings || [];
            displayBookings(bookings);
          },
          error: function() {
            showError('Failed to load bookings');
          }
        });
      }
      
      function displayBookings(bookings) {
        const container = $('#bookingsContent');
        container.empty();
        
        if (bookings.length === 0) {
          container.html(`
            <div class="no-bookings">
              <h2>No Bookings Yet</h2>
              <p>You haven't made any car reservations yet. Browse our fleet and book your dream car!</p>
              <a href="index.html#vehicles" class="browse-btn">Browse Cars</a>
            </div>
          `);
          return;
        }
        
        bookings.forEach(booking => {
          const statusClass = booking.booking_status === 'confirmed' ? 'status-confirmed' : 
                             booking.booking_status === 'pending' ? 'status-pending' : 'status-cancelled';
          
          const card = $(`
            <div class="booking-card">
              <div class="booking-header">
                <div class="booking-id">Booking #${booking.booking_id}</div>
                <div class="booking-status ${statusClass}">${booking.booking_status.toUpperCase()}</div>
              </div>
              <div class="booking-body">
                <img src="${booking.car_image}" alt="${booking.car_name}" class="car-image" onerror="this.src='images/placeholder.jpg'">
                <div class="booking-details">
                  <h3>${booking.car_name}</h3>
                  <div class="detail-row">
                    <span class="detail-label">Car Type:</span>
                    <span class="detail-value">${booking.car_type}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Start Date:</span>
                    <span class="detail-value">${booking.start_date}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">End Date:</span>
                    <span class="detail-value">${booking.end_date}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Rental Days:</span>
                    <span class="detail-value">${booking.rental_days} days</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Daily Rate:</span>
                    <span class="detail-value">$${parseFloat(booking.car_price_per_day).toFixed(2)}/day</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Payment ID:</span>
                    <span class="detail-value">${booking.payment_id || 'N/A'}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Payment Status:</span>
                    <span class="detail-value">${booking.payment_status || 'pending'}</span>
                  </div>
                  <div class="detail-row" style="border-bottom: none; margin-top: 1rem;">
                    <span class="detail-label" style="font-size: 1.2rem;">Total Amount:</span>
                    <span class="detail-value total-amount">$${parseFloat(booking.total_amount).toFixed(2)}</span>
                  </div>
                </div>
              </div>
            </div>
          `);
          
          container.append(card);
        });
      }
      
      function showLoginPrompt() {
        $('#bookingsContent').html(`
          <div class="login-prompt">
            <h2>🔒 Please Login</h2>
            <p>You need to be logged in to view your bookings</p>
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="login-btn" style="background: #555;">Register</a>
          </div>
        `);
      }
      
      function showError(message) {
        $('#bookingsContent').html(`
          <div class="no-bookings">
            <h2>⚠️ Error</h2>
            <p>${message}</p>
            <a href="index.html" class="browse-btn">Back to Home</a>
          </div>
        `);
      }
      
      function logout() {
        sessionStorage.removeItem('userAuthenticated');
        sessionStorage.removeItem('userEmail');
        sessionStorage.removeItem('userName');
        window.location.href = 'login.html';
      }
    });
  </script>

</body>
</html>
